<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login &bull; Life Project Management System</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        body.login-page-body {
            background-color: var(--bg-canvas, #F8FAFC);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-sans);
            padding: 24px;
            margin: 0;
            overflow-y: auto;
        }

        .login-card-wrapper {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .login-brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .login-brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: linear-gradient(135deg, #0EA5E9 0%, #0284C7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            box-shadow: 0 2px 6px rgba(14, 165, 233, 0.25);
        }

        .login-brand-title {
            font-size: 19px;
            font-weight: 700;
            color: #0F172A;
            letter-spacing: -0.02em;
        }

        .login-card {
            background-color: #FFFFFF;
            border: 1px solid var(--border-card, #F1F5F9);
            border-radius: var(--radius-xl, 12px);
            padding: 32px 28px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .login-card-intro h1 {
            font-size: 16px;
            font-weight: 600;
            color: #0F172A;
            margin-bottom: 4px;
        }

        .login-card-intro p {
            font-size: 12.5px;
            color: #64748B;
        }

        /* Error Toast / Alert */
        .login-alert-toast {
            display: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.4;
            background-color: #FFE4E6;
            color: #E11D48;
            border: 1px solid #FECDD3;
            animation: fadeInToast 0.2s ease-in-out;
        }

        .login-alert-toast.toast-success {
            background-color: #DCFCE7;
            color: #15803D;
            border-color: #BBF7D0;
        }

        @keyframes fadeInToast {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .login-form-group label {
            font-size: 12px;
            font-weight: 500;
            color: #334155;
        }

        .login-input, .login-select {
            width: 100%;
            padding: 9px 12px;
            background-color: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: var(--radius-md, 6px);
            font-size: 13px;
            color: #0F172A;
            outline: none;
            transition: all 0.15s ease;
            box-sizing: border-box;
        }

        .login-input:focus, .login-select:focus {
            border-color: #0EA5E9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .btn-login-submit {
            width: 100%;
            padding: 10px 16px;
            background-color: #0EA5E9;
            color: #FFFFFF;
            border: 1px solid #0284C7;
            border-radius: var(--radius-md, 6px);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 1px 3px rgba(14, 165, 233, 0.3);
            margin-top: 4px;
        }

        .btn-login-submit:hover {
            background-color: #0284C7;
        }

        .btn-login-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Divider */
        .login-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 4px 0;
            color: #94A3B8;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .login-divider::before, .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #E2E8F0;
        }

        /* Google Login Button */
        .btn-google-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 9px 16px;
            background-color: #FFFFFF;
            color: #1E293B;
            border: 1px solid #CBD5E1;
            border-radius: var(--radius-md, 6px);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .btn-google-login:hover {
            background-color: #F8FAFC;
            border-color: #94A3B8;
        }

        .google-icon-svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* Demo Quick-Fill Persona Chips */
        .demo-personas-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 14px;
            border-top: 1px solid #F1F5F9;
        }

        .demo-personas-label {
            font-size: 11px;
            font-weight: 600;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .demo-chips-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .btn-demo-chip {
            padding: 4px 9px;
            border-radius: 4px;
            border: 1px solid #E2E8F0;
            background-color: #F8FAFC;
            font-size: 11.5px;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: all 0.12s ease;
        }

        .btn-demo-chip:hover {
            background-color: #E0F2FE;
            color: #0284C7;
            border-color: #BAE6FD;
        }
    </style>
</head>
<body class="login-page-body">

    <div class="login-card-wrapper">
        <!-- Brand Header -->
        <div class="login-brand-header">
            <div class="login-brand-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </div>
            <span class="login-brand-title">Life PMS</span>
        </div>

        <!-- Main Login Card -->
        <div class="login-card">
            <div class="login-card-intro">
                <h1>Sign in to workspace</h1>
                <p>Enter your name and registered email to continue to your dashboard.</p>
            </div>

            <!-- Error Toast / Alert Banner -->
            <div id="loginAlertToast" class="login-alert-toast" role="alert"></div>

            <!-- Login Form (Field 1: Name, Field 2: Email, Field 3: Role Selector) -->
            <form id="loginForm" class="login-form">
                <!-- Field 1: Name (text input) -->
                <div class="login-form-group">
                    <label for="loginName">Full Name</label>
                    <input type="text" id="loginName" class="login-input" placeholder="e.g. Devon Vance" required autocomplete="name">
                </div>

                <!-- Field 2: Email ID (email input) -->
                <div class="login-form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" class="login-input" placeholder="name@company.com" required autocomplete="email">
                </div>

                <!-- Field 3: Role Selector (Dropdown: Admin / Manager / Client / PM / Lead) -->
                <div class="login-form-group">
                    <label for="loginRole">Workspace Role</label>
                    <select id="loginRole" class="login-select">
                        <option value="Lead" selected>Lead (Engineering / QA)</option>
                        <option value="Admin">Admin (Executive Director)</option>
                        <option value="Manager">Manager (Project Manager)</option>
                        <option value="PM">PM (Product Manager)</option>
                        <option value="Client">Client (Stakeholder)</option>
                    </select>
                </div>

                <!-- Button: "Login" / "Continue" -->
                <button type="submit" id="btnLoginSubmit" class="btn-login-submit">
                    Login / Continue
                </button>
            </form>

            <!-- Divider: OR -->
            <div class="login-divider">OR</div>

            <!-- Button: "Continue with Google" with Google icon -->
            <button type="button" id="btnGoogleLogin" class="btn-google-login">
                <svg class="google-icon-svg" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continue with Google</span>
            </button>

            <!-- Quick Demo Persona Fill Chips -->
            <div class="demo-personas-box">
                <span class="demo-personas-label">Quick Sign-In Credentials</span>
                <div class="demo-chips-grid">
                    <button type="button" class="btn-demo-chip" data-name="Nikhil Kaushik" data-email="nikhil@lifepms.com" data-role="Admin">Nikhil Kaushik (Lead/Admin)</button>
                    <button type="button" class="btn-demo-chip" data-name="Divyansh Verma" data-email="divyansh@lifepms.com" data-role="Admin">Divyansh Verma (Admin)</button>
                    <button type="button" class="btn-demo-chip" data-name="Ritika Sharma" data-email="ritikasharma49527@gmail.com" data-role="Lead">Ritika Sharma</button>
                    <button type="button" class="btn-demo-chip" data-name="Backend Webmaska" data-email="backend.webmaska@gmail.com" data-role="Lead">Backend Webmaska</button>
                    <button type="button" class="btn-demo-chip" data-name="Sarah Jenkins" data-email="manager@lifepms.com" data-role="PM">Sarah Jenkins (PM)</button>
                    <button type="button" class="btn-demo-chip" data-name="Devon Vance" data-email="dev@lifepms.com" data-role="Lead">Devon Vance (Lead)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Auth Client Module -->
    <script type="module" src="/firebase-auth-client.js"></script>

    <!-- Login Page Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const alertToast = document.getElementById('loginAlertToast');
            const submitBtn = document.getElementById('btnLoginSubmit');
            const googleBtn = document.getElementById('btnGoogleLogin');

            function showToast(message, isSuccess = false) {
                alertToast.textContent = message;
                alertToast.className = isSuccess ? 'login-alert-toast toast-success' : 'login-alert-toast';
                alertToast.style.display = 'block';
            }

            function hideToast() {
                alertToast.style.display = 'none';
            }

            // Demo Chips Click -> Fill inputs
            document.querySelectorAll('.btn-demo-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    document.getElementById('loginName').value = chip.getAttribute('data-name');
                    document.getElementById('loginEmail').value = chip.getAttribute('data-email');
                    document.getElementById('loginRole').value = chip.getAttribute('data-role');
                    hideToast();
                });
            });

            // Form Submit: Validate Name, Email, Role
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideToast();

                const name = document.getElementById('loginName').value.trim();
                const email = document.getElementById('loginEmail').value.trim();
                const role = document.getElementById('loginRole').value;

                if (!name || !email) {
                    showToast('Please provide both Full Name and Email Address.');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Validating credentials...';

                try {
                    const res = await fetch('/api/v1/auth/validate-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, role })
                    });
                    const data = await res.json();

                    if (!data.success) {
                        showToast(data.error || 'User not found. Please contact admin or use invited email.');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Login / Continue';
                        return;
                    }

                    // On Success: Set auth, save token, redirect to dashboard
                    localStorage.setItem('life_pms_token', data.data.token);
                    localStorage.setItem('life_pms_user', JSON.stringify(data.data.user));
                    showToast('Welcome back, ' + data.data.user.name + '! Redirecting...', true);

                    setTimeout(() => {
                        window.location.href = '/';
                    }, 400);

                } catch (err) {
                    showToast(err.message || 'Validation request failed.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Login / Continue';
                }
            });

            // Google Login
            googleBtn.addEventListener('click', async () => {
                hideToast();
                const role = document.getElementById('loginRole').value || 'Lead';

                if (!window.firebaseAuthClient) {
                    showToast('Firebase Auth client initializing. Please try again.');
                    return;
                }

                googleBtn.disabled = true;
                googleBtn.innerHTML = '<span>Connecting to Google...</span>';

                try {
                    const { auth, GoogleAuthProvider, signInWithPopup } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
                    const provider = new GoogleAuthProvider();
                    const result = await signInWithPopup(window.firebaseAuthClient.auth, provider);
                    const googleUser = result.user;

                    // Validate Google User against users and invited_members
                    const idToken = await googleUser.getIdToken();
                    const res = await fetch('/api/v1/auth/google-validate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: googleUser.email,
                            name: googleUser.displayName || googleUser.email.split('@')[0],
                            idToken,
                            role
                        })
                    });
                    const data = await res.json();

                    if (!data.success) {
                        showToast(data.error || 'Not invited. Please contact admin or use invited email.');
                        googleBtn.disabled = false;
                        googleBtn.innerHTML = `
                            <svg class="google-icon-svg" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                            </svg>
                            <span>Continue with Google</span>`;
                        return;
                    }

                    // Success: save token and redirect
                    localStorage.setItem('life_pms_token', data.data.token);
                    localStorage.setItem('life_pms_user', JSON.stringify(data.data.user));
                    showToast('Authenticated via Google. Redirecting...', true);

                    setTimeout(() => {
                        window.location.href = '/';
                    }, 400);

                } catch (err) {
                    showToast(err.message || 'Google Sign-In failed.');
                    googleBtn.disabled = false;
                    googleBtn.innerHTML = `
                        <svg class="google-icon-svg" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        <span>Continue with Google</span>`;
                }
            });
        });
    </script>
</body>
</html>
